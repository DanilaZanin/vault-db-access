name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing (OIDC)
    env:
      REGISTRY: ghcr.io
      VAULT_IMAGE: ghcr.io/danilazanin/vault-db-access-vault
      APP_IMAGE: ghcr.io/danilazanin/vault-db-access-middleware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The vault image goes first: the middleware image bakes in the sha256 of the plugin binary for each
      # architecture, taken from the vault image of the same platform (build context `vaultimg`).
      - id: vault_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.VAULT_IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest
      - id: vault
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./vault
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vault_meta.outputs.tags }}
          labels: ${{ steps.vault_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - id: app_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest
      - id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: middleware/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-contexts: vaultimg=docker-image://${{ env.VAULT_IMAGE }}@${{ steps.vault.outputs.digest }}
          push: true
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: cosign sign (keyless)
        env:
          VAULT_DIGEST: ${{ steps.vault.outputs.digest }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
        run: |
          cosign sign --yes "${VAULT_IMAGE}@${VAULT_DIGEST}"
          cosign sign --yes "${APP_IMAGE}@${APP_DIGEST}"

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v ver="${TAG#v}" '
            $0 ~ "^## v?"ver"$" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for ${TAG}" >&2; exit 1; }
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
