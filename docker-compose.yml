name: vdba

networks:
  vdba:
    driver: bridge

volumes:
  vault-data:
  vault-logs:      # Vault file audit device; NOT mounted into the middleware
  postgres-data:
  clickhouse-data:
  middleware-data: # SQLite grant store

x-app-build: &app-build
  context: .
  dockerfile: middleware/Dockerfile
  additional_contexts:
    vaultimg: "service:vault" # gives the app image the plugin's sha256 (register-by-hash)

x-secret-env: &secret-env
  POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
  PG_MANAGER_PASSWORD: ${PG_MANAGER_PASSWORD:-}
  PG_INTROSPECT_PASSWORD: ${PG_INTROSPECT_PASSWORD:-}
  CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-}
  CLICKHOUSE_MANAGER_PASSWORD: ${CLICKHOUSE_MANAGER_PASSWORD:-}
  CLICKHOUSE_INTROSPECT_PASSWORD: ${CLICKHOUSE_INTROSPECT_PASSWORD:-}
  VDBA_ADMIN_USER: ${VDBA_ADMIN_USER:-}
  VDBA_ADMIN_PASSWORD: ${VDBA_ADMIN_PASSWORD:-}

services:
  # Fails (and so blocks everything that depends on it) if any secret is empty or "changeme".
  preflight:
    build: *app-build
    image: vdba-app:local
    command: ["python", "-m", "app.preflight"]
    environment: *secret-env
    restart: "no"
    networks: [vdba]

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    depends_on:
      preflight: {condition: service_completed_successfully}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      POSTGRES_DB: appdb
      VDBA_PG_MANAGER_PASSWORD: ${PG_MANAGER_PASSWORD:-}
      VDBA_PG_INTROSPECT_PASSWORD: ${PG_INTROSPECT_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks: [vdba]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33
    restart: unless-stopped
    depends_on:
      preflight: {condition: service_completed_successfully}
    environment:
      CLICKHOUSE_USER: bootstrap_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-}
      CLICKHOUSE_DB: appdb
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      VDBA_CH_MANAGER_PASSWORD: ${CLICKHOUSE_MANAGER_PASSWORD:-}
      VDBA_CH_INTROSPECT_PASSWORD: ${CLICKHOUSE_INTROSPECT_PASSWORD:-}
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:8123:8123"
    networks: [vdba]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault:
    build:
      context: ./vault
    image: vdba-vault:local
    restart: unless-stopped
    depends_on:
      preflight: {condition: service_completed_successfully}
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      # Plain HTTP on the internal docker network and 127.0.0.1 only (demo). For anything else put
      # TLS on the listener (see README "Production").
      VAULT_LOCAL_CONFIG: >-
        {"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"api_addr":"http://vault:8200"}
    volumes:
      - vault-data:/vault/file
      - vault-logs:/vault/logs
      - ./vault/config.hcl:/vault/config/config.hcl:ro
    command: ["server"]
    ports:
      - "127.0.0.1:8200:8200"
    networks: [vdba]
    healthcheck:
      # healthy as soon as the API answers, sealed or not; setup does the unseal.
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200' >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-off bootstrap (compose profile "setup"): init/unseal Vault, write keys to ./secrets,
  # enable audit, provision engines/policies/AppRole, hand the AppRole secret to the middleware
  # through ./secrets/approle, then revoke the root token. Not part of the running stack.
  setup:
    profiles: [setup]
    build: *app-build
    image: vdba-app:local
    user: root
    command: ["python", "-m", "app.setup"]
    depends_on:
      vault: {condition: service_healthy}
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      <<: *secret-env
      VAULT_ADDR: http://vault:8200
      VDBA_SETUP_ARGS: ${VDBA_SETUP_ARGS:-}
      VDBA_ALLOW_INSECURE: ${VDBA_ALLOW_INSECURE:-}
      VDBA_PG_SSLMODE: ${VDBA_PG_SSLMODE:-}
      VDBA_PG_SSLROOTCERT: ${VDBA_PG_SSLROOTCERT:-}
      VDBA_TTL_MAX_SECONDS: ${VDBA_TTL_MAX_SECONDS:-86400}
      VDBA_TEST_HOOKS: ${VDBA_TEST_HOOKS:-0}
    volumes:
      - ./secrets:/secrets
    networks: [vdba]

  middleware:
    build: *app-build
    image: vdba-app:local
    restart: unless-stopped
    depends_on:
      preflight: {condition: service_completed_successfully}
      vault: {condition: service_healthy}
    environment:
      VAULT_ADDR: http://vault:8200
      VDBA_POSTGRES_HOST: postgres
      VDBA_CLICKHOUSE_HOST: clickhouse
      VDBA_DB_PATH: /data/vdba.sqlite3
      VDBA_APPROLE_DIR: /run/vdba/approle
      VDBA_TTL_MIN_SECONDS: ${VDBA_TTL_MIN_SECONDS:-10}
      VDBA_TTL_MAX_SECONDS: ${VDBA_TTL_MAX_SECONDS:-86400}
      VDBA_RECONCILE_INTERVAL: ${VDBA_RECONCILE_INTERVAL:-60}
      VDBA_SESSION_RECHECK_SECONDS: ${VDBA_SESSION_RECHECK_SECONDS:-300}
      VDBA_PG_SSLMODE: ${VDBA_PG_SSLMODE:-}
      VDBA_ALLOW_INSECURE: ${VDBA_ALLOW_INSECURE:-}
      VDBA_TEST_HOOKS: ${VDBA_TEST_HOOKS:-0}
    volumes:
      - middleware-data:/data
      - ./secrets/approle:/run/vdba/approle:ro   # ONLY this directory, never ./secrets itself
    ports:
      - "127.0.0.1:8000:8000"
    networks: [vdba]
