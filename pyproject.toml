[project]
name = "vault-db-access"
version = "0.1.0"
description = "Self-service temporary PostgreSQL/ClickHouse credentials issued through HashiCorp Vault"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi",
    "starlette",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "hvac",
    "psycopg[binary]>=3.2",
    "clickhouse-connect",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest", "requests", "ruff", "pip-audit"]

[tool.pytest.ini_options]
pythonpath = ["middleware"]
testpaths = ["tests"]
markers = ["integration: needs the running compose stack"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
